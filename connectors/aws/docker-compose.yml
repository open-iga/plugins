services:
    ministack:
        image: ministackorg/ministack:1.5
        tty: true
        ports:
            - '4566:4566'
        # MiniStack is in-memory by default (ephemeral), which is what we want for local testing;
        # persistence is opt-in (e.g. S3_PERSIST) and intentionally left off here.

    stackport:
        image: davireis/stackport:latest
        ports:
            - '8080:8080'
        environment:
            AWS_ENDPOINT_URL: http://ministack:4566
            AWS_REGION: us-east-1
            AWS_ACCESS_KEY_ID: test
            AWS_SECRET_ACCESS_KEY: test
        restart: unless-stopped
        depends_on:
            ministack:
                condition: service_started
