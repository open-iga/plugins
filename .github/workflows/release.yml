name: Release

on:
    push:
        branches: [main]

permissions:
    contents: write
    pull-requests: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: oven-sh/setup-bun@v2

            - name: Install extism-js
              env:
                  # Version is pinned in package.json (config.extism-js-version);
                  # the checksum verifies the installer at that tag before it
                  # runs with this job's write token.
                  INSTALLER_SHA256: c395d700898249a49c54072950fbd2d0e4d3719acf5b4390f1cb142680ec1f05
                  # The installer downloads the extism-js binary separately (unverified), so
                  # also pin the installed binary. Linux x86_64 asset for the tag above; a
                  # changed release asset mismatches here and fails before it ever runs.
                  EXTISM_JS_SHA256: 4552ee7385d2f0583363448c9e45aa733dec8d7edac8d646b69ee1271ad09483
              run: |
                  EXTISM_JS_TAG="$(jq -r '.config["extism-js-version"]' package.json)"
                  curl -fLs "https://raw.githubusercontent.com/extism/js-pdk/${EXTISM_JS_TAG}/install.sh" -o /tmp/extism-install.sh
                  echo "${INSTALLER_SHA256}  /tmp/extism-install.sh" | sha256sum -c -
                  bash /tmp/extism-install.sh "$EXTISM_JS_TAG"
                  echo "${EXTISM_JS_SHA256}  $(command -v extism-js)" | sha256sum -c -

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Create Version PR
              id: changesets
              uses: changesets/action@v1
              with:
                  version: bun run version-packages
                  commit: 'chore: version packages'
                  title: 'chore: version packages'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Compile and publish GitHub release
              if: steps.changesets.outputs.hasChangesets == 'false'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  TAG="@open-iga/aws@$(jq -r .version connectors/aws/package.json)"
                  if gh release view "$TAG" >/dev/null 2>&1; then
                      echo "Release $TAG already exists; nothing to do."
                      exit 0
                  fi
                  bunx turbo run compile
                  cd connectors/aws/.open-iga
                  sha256sum aws.wasm > aws.wasm.sha256
                  gh release create "$TAG" --title "$TAG" --generate-notes \
                      aws.wasm aws.wasm.sha256
