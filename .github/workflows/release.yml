name: Release

on:
    push:
        branches: [main]

permissions:
    contents: write
    pull-requests: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: oven-sh/setup-bun@v2

            - name: Install extism-js
              env:
                  # Version is pinned in package.json (config.extism-js-version);
                  # the checksum verifies the installer at that tag before it
                  # runs with this job's write token.
                  INSTALLER_SHA256: c395d700898249a49c54072950fbd2d0e4d3719acf5b4390f1cb142680ec1f05
              run: |
                  EXTISM_JS_TAG="$(jq -r '.config["extism-js-version"]' package.json)"
                  curl -fLs "https://raw.githubusercontent.com/extism/js-pdk/${EXTISM_JS_TAG}/install.sh" -o /tmp/extism-install.sh
                  echo "${INSTALLER_SHA256}  /tmp/extism-install.sh" | sha256sum -c -
                  bash /tmp/extism-install.sh "$EXTISM_JS_TAG"

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Create Version PR or GitHub release
              id: changesets
              uses: changesets/action@v1
              with:
                  version: bun run version-packages
                  publish: bun run tag-packages
                  createGithubReleases: true
                  commit: "chore: version packages"
                  title: "chore: version packages"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Compile
              if: steps.changesets.outputs.published == 'true'
              run: bunx turbo run compile

            - name: Upload wasm + sha256 to the GitHub release
              if: steps.changesets.outputs.published == 'true'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  TAG="@open-iga/aws@$(jq -r .version connectors/aws/package.json)"
                  cd connectors/aws/.open-iga
                  sha256sum aws.wasm > aws.wasm.sha256
                  gh release upload "$TAG" --clobber aws.wasm aws.wasm.sha256
